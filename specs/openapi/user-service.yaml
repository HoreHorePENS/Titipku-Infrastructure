openapi: 3.1.0

info:
  title: Titipku User Profile API
  version: 1.0.0
  description: |
    HTTP contract for `user-service` — reading and upserting the caller's
    own profile in the original Titipku marketplace scaffold.

    > **Legacy scaffold.** This service is retained for reference and is not
    > part of the deployed Compose stack. The production monolith is
    > `core-service` (see `core-service.yaml`).

    ## Conventions

    - Versioned routes under `/v1`.
    - Successful responses use a `data` envelope; errors use an `error`
      object with a stable `code`, `message`, and optional `fields`.
      Every response carries a `request_id`.
    - All routes require `Authorization: Bearer <token>`; the token
      identifies the profile owner via the `sub` claim (HS256 JWT issued by
      `auth-service`, issuer `titipku`).
    - There is no list endpoint: profiles are always accessed for the
      authenticated user only.
    - Request bodies must be a single JSON object; unknown fields are
      rejected, bodies are limited to 1 MiB.

  license:
    name: Proprietary

servers:
  - url: http://localhost:8082
    description: Local development (default HTTP_PORT)

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Profiles
    description: Own-profile read and upsert

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: liveness
      summary: Liveness probe
      description: Always succeeds while the process is running; does not touch the database.
      security: []
      responses:
        "200":
          description: Process is alive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"

  /readyz:
    get:
      tags: [Health]
      operationId: readiness
      summary: Readiness probe
      description: Pings PostgreSQL (2 second timeout) and reports readiness.
      security: []
      responses:
        "200":
          description: Service is ready to accept traffic.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/profiles/me:
    get:
      tags: [Profiles]
      operationId: getMyProfile
      summary: Get my profile
      responses:
        "200":
          description: The caller's profile.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Profiles]
      operationId: upsertMyProfile
      summary: Create or replace my profile
      description: |
        Upsert keyed by the authenticated user id. All four fields are
        required by validation (empty `phone`, `avatar_url`, and `bio` are
        allowed; empty `full_name` is not).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProfileRequest"
      responses:
        "200":
          description: Profile saved.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 JWT issued by `auth-service`
        (`/v1/auth/register` or `/v1/auth/login`). Required claims: `iss`,
        `sub` (user id), `exp`.

  headers:
    XRequestID:
      description: Request id, echoed from `X-Request-ID` or generated by the server.
      schema:
        type: string

  responses:
    BadRequest:
      description: Validation failed; `fields` maps offending inputs to messages.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: request validation failed
              fields:
                bio: must not exceed 500 characters
    Unauthorized:
      description: Missing, invalid, or expired token.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHORIZED
              message: invalid or expired access token
    NotFound:
      description: "Profile does not exist yet (`PROFILE_NOT_FOUND`)."
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: PROFILE_NOT_FOUND
              message: profile not found
    ServiceUnavailable:
      description: A required dependency (PostgreSQL) is unavailable.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: DEPENDENCY_UNAVAILABLE
              message: required dependency is unavailable

  schemas:
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - UNAVAILABLE
            - METHOD_NOT_ALLOWED
            - RATE_LIMITED
            - INTERNAL_ERROR
            - DEPENDENCY_UNAVAILABLE
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
        request_id:
          type: string

    LivenessResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              const: ok
        request_id:
          type: string

    ReadinessResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              const: ready
        request_id:
          type: string

    UpsertProfileRequest:
      type: object
      additionalProperties: false
      required: [full_name, phone, avatar_url, bio]
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          description: >
            Optional when empty; otherwise 8-20 characters of digits with
            optional leading `+`, spaces, dashes, and parentheses.
          maxLength: 20
        avatar_url:
          type: string
          description: Optional when empty; otherwise an absolute http/https URL up to 500 characters.
          maxLength: 500
        bio:
          type: string
          description: Free text, at most 500 characters.
          maxLength: 500

    Profile:
      type: object
      required: [user_id, full_name, phone, avatar_url, bio, created_at, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
        phone:
          type: string
        avatar_url:
          type: string
        bio:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Profile"
        request_id:
          type: string
